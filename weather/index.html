<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>꼬마 기상캐스터 | 소소숲</title><meta name="description" content="날씨 뉴스 '오늘 큰 일교차, 토요일엔 첫 영하 추위' 읽기자료를 복습하는 학습게임"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#eaf4fb;color:#23384A}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  /* 하늘 날씨 지도 → 정거장(6개) → 날씨 수첩. 늦가을 하늘 한 가지 분위기로 고정 */
  :root{
    color-scheme:light;
    --sky:#DDEEFA;
    --sea:#EEF6FC;
    --paper:#FFFFFF;
    --ink:#23384A;
    --sub:#5F7486;
    --line:#CFE0EE;
    --leaf:#3A86C8; --leaf-soft:#E3F0FA;
    --coral:#E8782E; --coral-soft:#FDEADB;
    --lemon:#F2B100; --lemon-soft:#FFF5CF;
    --mint:#2FA06E;  --mint-soft:#DEF3E7;
    --blue:#3C8DBB;  --blue-soft:#DEEFF7;
    --grape:#8A6BC6; --grape-soft:#ECE6F8;
    --nut:#A9743A;   --nut-soft:#F3E7D8;
    --good:#2FA06E; --bad:#E0574B;
    --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:linear-gradient(180deg,var(--sky) 0%,var(--sea) 55%,#F4F8FB 100%) fixed;
    color:var(--ink);
    font-family:var(--body);
    font-size:18px;line-height:1.6;
    word-break:keep-all;overflow-wrap:break-word;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 40px;}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;}
  button:focus-visible{outline:3px solid var(--leaf);outline-offset:3px;border-radius:14px;}
  h1,h2,h3,.disp{font-family:var(--display);font-weight:400;letter-spacing:0.01em;text-wrap:balance;margin:0;}

  .bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .bar .home{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:6px 14px;font-family:var(--display);font-size:18px;}
  .bar .spacer{flex:1;}
  .stars{font-family:var(--display);font-size:20px;background:var(--lemon-soft);border:2px solid #F2DA86;border-radius:999px;padding:4px 14px;font-variant-numeric:tabular-nums;}
  .sound{background:var(--paper);border:2px solid var(--line);border-radius:14px;width:46px;height:46px;font-size:20px;}

  /* 표지 */
  .hero{background:var(--paper);border:3px solid var(--line);border-radius:28px;padding:22px 22px 18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;}
  .hero .kick{font-family:var(--display);color:var(--leaf);font-size:17px;}
  .hero h1{font-size:clamp(30px,6.4vw,46px);line-height:1.15;}
  .hero h1 span{color:var(--coral);}
  .hero p{margin:6px 0 0;color:var(--sub);}
  .hero-art{width:150px;height:130px;}

  /* 날씨 지도 */
  .trail{position:relative;margin-top:18px;display:grid;gap:14px;}
  .trail::before{content:"";position:absolute;left:43px;top:30px;bottom:30px;width:8px;border-radius:8px;
    background:repeating-linear-gradient(180deg,#BFD9EE 0 14px,transparent 14px 24px);}
  .stop{position:relative;display:flex;align-items:center;gap:14px;text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:12px 16px 12px 12px;transition:transform .15s,border-color .15s;width:100%;}
  .stop:hover{transform:translateY(-2px);border-color:var(--c);}
  .stop .num{flex:0 0 auto;width:66px;height:66px;border-radius:50%;background:var(--cs);border:3px solid var(--c);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:28px;color:var(--c);}
  .stop.done .num{background:var(--c);color:#fff;}
  .stop .txt{flex:1;min-width:0;}
  .stop .t{font-family:var(--display);font-size:22px;}
  .stop .d{color:var(--sub);font-size:16px;}
  .stop .got{font-family:var(--display);font-size:17px;color:var(--sub);white-space:nowrap;}
  .notebook-btn{margin-top:18px;width:100%;background:var(--ink);color:#fff;border-radius:20px;padding:16px;font-family:var(--display);font-size:22px;}

  /* 게임 판 */
  .board{background:var(--paper);border:3px solid var(--line);border-radius:28px;padding:20px 18px 22px;}
  .stage-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .stage-head .tag{font-family:var(--display);color:#fff;background:var(--c);border-radius:12px;padding:2px 12px;font-size:17px;}
  .stage-head h2{font-size:26px;}
  .progress{display:flex;gap:6px;margin:10px 0 4px;}
  .progress i{flex:1;height:10px;border-radius:10px;background:#E6EEF5;}
  .progress i.on{background:var(--c);}
  .ask{font-size:19px;margin:10px 0 14px;color:var(--sub);}
  .ask b{color:var(--ink);}

  /* 뜻→낱말 고르기 / 빈칸 채우기 공통 */
  .means{background:var(--mint-soft);border:3px solid #B2E0C6;border-radius:18px;padding:14px 16px;font-size:20px;text-align:center;margin:6px 0 14px;line-height:1.5;}
  .picklist{display:grid;gap:10px;}
  .pickbtn{background:#FBFDFF;border:3px solid var(--line);border-radius:16px;padding:14px 16px;font-family:var(--display);font-size:23px;text-align:center;}
  .pickbtn:hover{border-color:var(--c);}

  /* 낱말 가족 힌트 */
  .rootchip{display:inline-flex;align-items:center;gap:8px;background:var(--nut-soft);border:2px solid #E0C9A6;border-radius:999px;padding:4px 14px 4px 10px;font-family:var(--display);font-size:18px;color:#7A5222;margin:0 0 8px;}
  .rootchip b{font-weight:400;background:var(--nut);color:#fff;border-radius:999px;padding:0 10px;}

  /* 빈칸 문장 */
  .sentence{font-family:var(--display);font-size:clamp(22px,5vw,30px);text-align:center;margin:8px 0 14px;line-height:1.5;}
  .sentence .blank{display:inline-block;min-width:3.4em;border-bottom:4px solid var(--c);color:var(--c);}
  .pieces{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:64px;}
  .piece{background:var(--paper);border:3px solid #BFD9EE;border-radius:16px;padding:10px 18px;font-family:var(--display);font-size:22px;box-shadow:0 3px 0 #BFD9EE;}
  .piece:active{transform:translateY(2px);box-shadow:none;}

  /* 순서 맞추기 */
  .slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 16px;}
  .slot{min-height:120px;border-radius:18px;border:3px dashed var(--c);background:var(--cs);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8px 6px;text-align:center;}
  .slot .lbl{font-family:var(--display);font-size:16px;color:var(--c);margin-bottom:4px;}
  .slot .fill{font-family:var(--body);font-size:15px;line-height:1.35;min-height:1.3em;word-break:keep-all;}
  .slot.filled{border-style:solid;background:var(--paper);}

  /* 두 칸 선택 (사실/의견) */
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .duo button{border-radius:22px;padding:18px 10px;font-family:var(--display);font-size:26px;border:4px solid;}
  .duo .fact{color:var(--blue);border-color:#BBDCEC;background:var(--blue-soft);}
  .duo .opin{color:var(--grape);border-color:#D3C9F0;background:var(--grape-soft);}

  /* O X */
  .quiz{font-family:var(--display);font-size:clamp(21px,4.8vw,27px);text-align:center;background:var(--leaf-soft);border-radius:20px;padding:20px 14px;margin:6px 0 16px;line-height:1.45;}
  .ox{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .ox button{border-radius:22px;padding:14px;font-family:var(--display);font-size:46px;border:4px solid;}
  .ox .o{color:var(--mint);border-color:#B2E0C6;background:var(--mint-soft);}
  .ox .x{color:var(--coral);border-color:#F6CDA8;background:var(--coral-soft);}

  /* 피드백 */
  .feedback{min-height:56px;margin-top:14px;border-radius:16px;padding:10px 14px;text-align:center;font-size:19px;}
  .feedback.good{background:var(--mint-soft);color:#176B49;}
  .feedback.bad{background:var(--coral-soft);color:#A8511C;}
  .feedback b{font-family:var(--display);font-weight:400;font-size:22px;}
  .next{display:block;margin:12px auto 0;background:var(--ink);color:#fff;border-radius:16px;padding:10px 30px;font-family:var(--display);font-size:21px;}
  .is-right{border-color:var(--good)!important;background:var(--mint-soft)!important;}
  .is-wrong{border-color:var(--bad)!important;}
  .shake{animation:shake .35s;}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .pop{animation:pop .4s;}
  @keyframes pop{50%{transform:scale(1.06)}}

  .clear{text-align:center;padding:10px 0;}
  .clear .big{font-size:64px;line-height:1.1;}
  .clear h2{font-size:30px;margin:6px 0;}
  .clear p{color:var(--sub);margin:0 0 10px;}

  /* 날씨 수첩 */
  .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px;}
  .mcard{background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:12px;text-align:center;}
  .mcard svg{width:84px;height:84px;}
  .mcard .nm{font-family:var(--display);font-size:20px;}
  .mcard .sm{font-size:15.5px;color:var(--sub);line-height:1.5;}
  .mcard .sm b{color:var(--leaf);font-weight:400;font-family:var(--display);}
  .mcard.locked{filter:grayscale(1);opacity:.45;}
  .badge{margin-top:16px;background:linear-gradient(135deg,#E3F0FA,#DEF3E7 60%,#FFF5CF);border:3px solid #B5D6EE;border-radius:26px;padding:18px;text-align:center;}
  .badge h3{font-size:26px;}
  .badge .who{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:10px 0;}
  .badge input{font-family:var(--display);font-size:22px;text-align:center;border:3px solid #B5D6EE;border-radius:14px;padding:6px 10px;width:min(220px,100%);background:#fff;color:var(--ink);}
  .cert-img{display:block;width:100%;max-width:440px;height:auto;margin:12px auto 0;border-radius:18px;box-shadow:0 6px 20px rgba(35,56,74,.15);background:#fff;}
  .save-cert{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--leaf);color:#fff;border-radius:16px;padding:10px 24px;font-family:var(--display);font-size:21px;box-shadow:0 3px 0 #23638F;}
  .save-cert:active{transform:translateY(2px);box-shadow:none;}
  .save-cert:disabled{opacity:.5;cursor:default;}
  .cert-hint{font-size:15px;color:var(--sub);margin:8px 0 0;}
  .reset{display:block;margin:18px auto 0;color:var(--sub);text-decoration:underline;font-size:15px;}

  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5;}
  .confetti span{position:absolute;top:-40px;font-size:28px;animation:fall 1.8s ease-in forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(300deg);}}

  @media (max-width:520px){
    .hero{grid-template-columns:1fr;}
    .hero-art{display:none;}
    .slot .fill{font-size:13.5px;}
    .slot{min-height:112px;}
    .pickbtn{font-size:21px;}
  }
  .credit{text-align:center;font-family:var(--display);font-size:15px;color:var(--sub);letter-spacing:0.03em;padding-block:0 28px;margin-top:-18px;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>

<script>
(() => {
  /* ---------- 학습 내용: 날씨 뉴스 '오늘 큰 일교차, 토요일엔 첫 영하 추위' ---------- */
  const VOCAB = [
    {w:'일기예보', mean:'날씨가 어떻게 될지 미리 알려 주는 것'},
    {w:'기온',   mean:'공기가 따뜻하고 차가운 정도'},
    {w:'일교차', mean:'하루 동안 가장 높은 기온과 가장 낮은 기온의 차이'},
    {w:'유의',   mean:'마음에 두고 조심하는 것'},
    {w:'예상',   mean:'앞으로 일어날 일을 미리 생각해 짐작하는 것'},
    {w:'영하',   mean:'온도가 0도보다 낮은 것'},
    {w:'절기',   mean:'한 해를 계절에 따라 스물넷으로 나눈 때'},
  ];
  // 1. 낱말 뜻 맞히기
  const VOC = VOCAB.map(v => ({mean:v.mean, ans:v.w}));
  // 2. 빈칸 채우기
  const FILL = [
    {pre:'아침에', post:'를 보고 우산을 챙겼어요.', ans:'일기예보', ch:['일기예보','일교차','절기']},
    {pre:'아침 8도, 낮 18도라서', post:'가 10도나 돼요.', ans:'일교차', ch:['일교차','영하','예상']},
    {pre:'일교차가 크니 옷차림에', post:'해야 해요.', ans:'유의', ch:['유의','기온','예상']},
    {pre:'토요일 아침, 서울 기온이 0도보다 낮은', post:'로 떨어져요.', ans:'영하', ch:['영하','유의','절기']},
    {pre:'입동은 겨울이 시작된다는', post:'예요.', ans:'절기', ch:['절기','예상','일교차']},
  ];
  // 3. 낱말 가족 넓히기 (어휘 확장: 豫 미리(일기예보·예상·예습·예방) · 溫 따뜻하다 · 寒 차다)
  const EXT = [
    {root:'예 豫', hint:'미리', tip:'날씨 = 일기(日氣), 알리다 = 보(報)', q:'날씨가 어떻게 될지 미리 알려 주는 것', ans:'일기예보', ch:['일기예보','예상','예습'], why:'日(날 일) + 氣(기운 기) = 날씨, 豫(미리 예) + 報(알릴 보) = 미리 알림. 뉴스에 나온 말이에요.'},
    {root:'예 豫', hint:'미리', tip:'생각 = 상(想)', q:'앞으로 일어날 일을 미리 생각해 짐작하는 것', ans:'예상', ch:['예상','예방','일기예보'], why:'豫(미리 예) + 想(생각 상). 뉴스에서 "비가 올 것으로 예상돼요"라고 했어요.'},
    {root:'예 豫', hint:'미리', tip:'익히다 = 습(習)', q:'배울 것을 미리 익혀 두는 것', ans:'예습', ch:['예습','예상','예방'], why:'豫(미리 예) + 習(익힐 습). 내일 배울 것을 오늘 미리!'},
    {root:'예 豫', hint:'미리', tip:'막다 = 방(防)', q:'나쁜 일이 생기기 전에 미리 막는 것', ans:'예방', ch:['예방','예습','일기예보'], why:'豫(미리 예) + 防(막을 방). 손 씻기로 감기 예방!'},

    {root:'온 溫', hint:'따뜻하다', tip:'정도 = 도(度)', q:'따뜻하고 차가운 정도를 숫자로 나타낸 것', ans:'온도', ch:['온도','온수','보온'], why:'溫(따뜻할 온) + 度(정도 도). 온도계로 재요.'},

    {root:'한 寒', hint:'차다', tip:'막다 = 방(防)', q:'추위를 막는 것', ans:'방한', ch:['방한','한파','한기'], why:'防(막을 방) + 寒(찰 한). 방한 장갑, 방한복!'},
    {root:'한 寒', hint:'차다', tip:'기운 = 기(氣)', q:'몸에 느껴지는 차가운 기운', ans:'한기', ch:['한기','방한','한파'], why:'寒(찰 한) + 氣(기운 기). 기온의 기(氣)와 같은 글자예요.'},
  ];
  // 4. 차례 맞추기 (처음→다음→마지막)
  const ORDERS = [
    {steps:['수요일: 늦가을 날씨, 일교차가 커요','목요일: 비가 전국으로 넓어져요','토요일(입동): 서울에 첫 영하 추위']},
    {steps:['늦은 오후, 제주에 비가 오기 시작해요','다음 날, 비가 전국으로 넓어져요','금요일부터 다시 추워져요']},
    {steps:['아침에 일기예보를 봐요','오늘 일교차가 크다는 걸 알아요','겉옷을 챙겨 학교에 가요']},
  ];
  // 5. 사실일까 의견일까
  const FO = [
    {q:'토요일은 절기상 입동이에요.', a:'fact', why:'달력과 뉴스로 확인할 수 있는 사실이에요.'},
    {q:'추운 겨울보다 따뜻한 봄이 훨씬 좋아요.', a:'opin', why:'사람마다 다른 생각이라서 의견이에요.'},
    {q:'4일 아침 서울의 기온은 8도였어요.', a:'fact', why:'뉴스에 나온 숫자로 확인되는 사실이에요.'},
    {q:'첫 영하 추위가 온다니 정말 신나요.', a:'opin', why:'느낌을 말한 것이라 의견이에요.'},
    {q:'0도보다 낮은 온도를 영하라고 해요.', a:'fact', why:'낱말의 뜻으로 확인되는 사실이에요.'},
  ];
  // 6. 날씨 준비 O X
  const OX = [
    {q:'일교차가 큰 날에는 겉옷을 챙겨, 더우면 벗어요.', a:true, why:'아침엔 쌀쌀하고 낮엔 따뜻하니 겹쳐 입는 게 좋아요.'},
    {q:'영하는 0도보다 높은 온도예요.', a:false, why:'영하는 0도보다 낮은 온도예요. (하 下 = 아래)'},
    {q:'안개가 낀 날에는 앞이 잘 안 보이니 길을 걸을 때 더 조심해요.', a:true, why:'안개가 짙으면 가까운 곳도 뿌옇게 보여요.'},
    {q:'일기예보는 지난주 날씨를 알려 주는 거예요.', a:false, why:'일기예보는 앞으로의 날씨를 미리(豫 미리 예) 알려 줘요.'},
    {q:'입동은 봄이 시작된다는 절기예요.', a:false, why:'입동은 겨울(동 冬)이 시작된다는 절기예요.'},
    {q:'일기예보를 보면 무엇을 챙길지 미리 준비할 수 있어요.', a:true, why:'비 소식엔 우산, 추위 소식엔 장갑을 챙겨요.'},
  ];
  const STAGES = [
    {id:'voc',   t:'낱말 뜻 찾기',     d:'뜻을 보고 알맞은 낱말 고르기',        c:'var(--mint)',  cs:'var(--mint-soft)',  n:VOC.length},
    {id:'fill',  t:'빈칸 채우기',       d:'문장에 알맞은 낱말 넣기',              c:'var(--lemon)', cs:'var(--lemon-soft)', n:FILL.length},
    {id:'ext',   t:'낱말 가족 넓히기',  d:"'예'·'온'·'한'으로 낱말 넓히기",       c:'var(--nut)',   cs:'var(--nut-soft)',   n:EXT.length},
    {id:'order', t:'차례대로 맞추기',   d:'날씨가 바뀌는 차례대로 조각 넣기',     c:'var(--coral)', cs:'var(--coral-soft)', n:ORDERS.length},
    {id:'fo',    t:'사실일까 의견일까', d:'사실과 의견을 구별해요',               c:'var(--grape)', cs:'var(--grape-soft)', n:FO.length},
    {id:'ox',    t:'날씨 준비 O X',     d:'날씨에 맞게 준비하는 방법 알아보기',   c:'var(--blue)',  cs:'var(--blue-soft)',  n:OX.length},
  ];

  /* ---------- 상태 ---------- */
  const KEY = 'little-weathercaster';
  const fresh = () => ({view:'map', stage:0, q:0, stars:0, done:{}, best:{}, name:'', sound:true});
  let state = fresh();
  let round = null;
  try { const saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved) state = {...fresh(), ...saved, view:'map'}; } catch(e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };

  /* ---------- 소리 (효과음만, 음성 없음) ---------- */
  let ac = null;
  function tone(freqs, dur = 0.12) {
    if (!state.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      freqs.forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.value = f;
        const t0 = ac.currentTime + i * dur;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur * 1.6);
        o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + dur * 1.7);
      });
    } catch(e) {}
  }
  const ding = () => tone([660, 880]);
  const oops = () => tone([300, 240], 0.14);
  const fanfare = () => tone([523, 659, 784, 1047], 0.13);

  /* ---------- 도우미 ---------- */
  const $app = document.getElementById('app');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const ic = id => `<svg viewBox="0 0 100 100" aria-hidden="true"><use href="#b-${id}"/></svg>`;
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const stageDone = i => !!state.done[STAGES[i].id];

  function confetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const box = document.getElementById('confetti');
    const icons = ['☀️','🌧️','❄️','⭐','🧣'];
    for (let i = 0; i < 26; i++) {
      const s = document.createElement('span');
      s.textContent = icons[i % icons.length];
      s.style.left = Math.random() * 100 + 'vw';
      s.style.animationDelay = Math.random() * 0.6 + 's';
      box.appendChild(s);
      setTimeout(() => s.remove(), 2600);
    }
  }

  function topBar(showHome) {
    return `<div class="bar">
      ${showHome ? '<button class="home" data-act="map">🗺️ 날씨 지도</button>' : ''}
      <span class="spacer"></span>
      <span class="stars" aria-label="모은 별">⭐ ${state.stars}</span>
      <button class="sound" data-act="sound" aria-label="효과음 켜기/끄기">${state.sound ? '🔊' : '🔈'}</button>
    </div>`;
  }

  /* ---------- 화면: 날씨 지도 ---------- */
  function renderMap() {
    const doneCount = STAGES.filter((_, i) => stageDone(i)).length;
    $app.innerHTML = `${topBar(false)}
      <section class="hero">
        <div>
          <div class="kick">🎙️ 꼬마 기상캐스터 출동!</div>
          <h1>날씨 뉴스를 읽고 <span>첫 추위</span>를 준비해요</h1>
          <p>정거장 여섯 곳을 돌며 날씨 뉴스를 복습해요.</p>
        </div>
        <svg class="hero-art" viewBox="0 0 150 130" aria-hidden="true"><use href="#b-map"/></svg>
      </section>
      <nav class="trail" aria-label="정거장">
        ${STAGES.map((s, i) => `
          <button class="stop ${stageDone(i) ? 'done' : ''}" style="--c:${s.c};--cs:${s.cs}" data-act="stage" data-i="${i}">
            <span class="num">${stageDone(i) ? '✓' : i + 1}</span>
            <span class="txt"><span class="t disp">${s.t}</span><br><span class="d">${s.d}</span></span>
            <span class="got">${state.best[s.id] != null ? `⭐ ${state.best[s.id]}/${s.n}` : `${s.n}문제`}</span>

  }

  /* ---------- 정거장 공통 틀 ---------- */
  function shell(inner) {
    const s = STAGES[state.stage];
    $app.innerHTML = `${topBar(true)}
      <section class="board" style="--c:${s.c};--cs:${s.cs}">
        <div class="stage-head"><span class="tag">정거장 ${state.stage + 1}</span><h2>${s.t}</h2></div>
        <div class="progress">${Array.from({length:s.n}, (_, i) => `<i class="${i < state.q ? 'on' : ''}"></i>`).join('')}</div>
        ${inner}
        <div class="feedback" id="fb"></div>
      </section>`;
  }

  function renderStage() {
    const s = STAGES[state.stage];
    if (state.q >= s.n) return renderClear();
    round = {tries:0, solved:false};
    ({voc:renderVoc, fill:renderFill, ext:renderExt, order:renderOrder, fo:renderFO, ox:renderOX})[s.id]();
  }

  function right(msg, el) {
    if (round.solved) return;
    round.solved = true;
    if (round.tries === 0) { state.stars++; round.star = true; }
    ding();
    if (el) el.classList.add('is-right', 'pop');
    const fb = document.getElementById('fb');
    fb.className = 'feedback good';
    fb.innerHTML = `<b>딩동댕! ${round.star ? '⭐ +1' : ''}</b><br>${msg}<button class="next" data-act="next">다음 ▶</button>`;
    document.querySelector('.stars').textContent = '⭐ ' + state.stars;
    save();
    fb.querySelector('.next').focus();
  }
  function wrong(msg, el) {
    round.tries++;
    oops();
    if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake', 'is-wrong'); }
    const fb = document.getElementById('fb');
    fb.className = 'feedback bad';
    fb.innerHTML = `<b>다시 해 볼까요?</b><br>${msg}`;
  }

  /* 1. 낱말 뜻 찾기 */
  function renderVoc() {
    const v = VOC[state.q];

    shell(`
      <p class="ask">뜻을 읽고, <b>알맞은 낱말</b>을 골라요.</p>

  }

  }

  function renderOrder() {
    const o = ORDERS[state.q];

  function drawOrder() {
    const labels = ['처음','다음','마지막'];
    const used = new Set(round.filled);
    shell(`
      <p class="ask">일이 일어나는 <b>차례대로</b> 조각을 넣어요. 칸을 누르면 조각이 돌아와요.</p>

          <span class="lbl">${i+1}. ${lbl}</span><span class="fill">${p != null ? esc(round.parts[p]) : ''}</span></button>`;
      }).join('')}</div>

  }

  }

  /* 정거장 완료 */
  function renderClear() {
    const s = STAGES[state.stage];
    const got = state.stageStars || 0;
    state.done[s.id] = true;
    state.best[s.id] = Math.max(state.best[s.id] || 0, got);
    save();
    fanfare(); confetti();
    const next = state.stage < STAGES.length - 1;
    $app.innerHTML = `${topBar(true)}
      <section class="board clear" style="--c:${s.c};--cs:${s.cs}">
        <div class="big">🎉</div>
        <h2>정거장 ${state.stage + 1} 통과!</h2>

      </section>`;
  }

      {ic:'thermo',   nm:'기온과 일교차', sm:'<b>일교차</b>는 하루 중<br>가장 높고 낮은 기온의 차이', need:'voc'},
      {ic:'umbrella', nm:'비 소식',       sm:'목요일엔 비가<br><b>전국</b>으로 넓어져요', need:'fill'},
      {ic:'cal',      nm:'낱말 가족',     sm:'<b>예</b>는 미리, <b>온</b>은<br>따뜻하다, <b>한</b>은 차다', need:'ext'},
      {ic:'cloud',    nm:'요일별 날씨',   sm:'수 일교차 → 목 비<br>→ 토 첫 <b>영하</b> 추위', need:'order'},
      {ic:'mic',      nm:'사실과 의견',   sm:'확인되면 <b>사실</b><br>느낌이면 <b>의견</b>', need:'fo'},
      {ic:'mitten',   nm:'추위 준비',     sm:'두꺼운 옷과<br><b>장갑</b>을 챙겨요', need:'ox'},
    ];
    $app.innerHTML = `${topBar(true)}
      <section class="board" style="--c:var(--ink);--cs:#E6F0F8">
        <div class="stage-head"><h2>📒 나의 날씨 수첩</h2></div>
        <p class="ask">정거장을 통과하면 날씨 카드가 하나씩 열려요.</p>
        <div class="cards">${cards.map(c => {
          const open = state.done[c.need];
          return `<div class="mcard ${open ? '' : 'locked'}">${ic(c.ic)}<div class="nm">${open ? c.nm : '???'}</div><div class="sm">${open ? c.sm : '정거장을 통과하면 열려요'}</div></div>`;
        }).join('')}</div>
        ${allDone ? `
        <div class="badge">
          <h3>🏅 꼬마 기상캐스터 인증서</h3>
          <div class="who"><label for="who">기상캐스터 이름</label><input id="who" maxlength="10" value="${esc(state.name)}" placeholder="이름 쓰기"></div>
          <img class="cert-img" id="certImg" alt="꼬마 기상캐스터 인증서">
          <div><button class="save-cert" id="saveCert" data-act="savecert" hidden>📥 인증서 이미지 저장</button></div>
          <p class="cert-hint" id="certHint">인증서 그림을 길게 누르면(컴퓨터는 오른쪽 클릭) 이미지로 저장할 수 있어요.</p>
        </div>` : `<p class="ask" style="text-align:center;margin-top:16px">정거장 여섯 곳을 모두 통과하면 <b>인증서</b>를 받아요!</p>`}
        <button class="reset" data-act="reset">처음부터 다시 하기</button>
      </section>`;
    const who = document.getElementById('who');
    if (who) {
      let t = null;
      who.addEventListener('input', () => { state.name = who.value; save(); clearTimeout(t); t = setTimeout(drawCert, 250); });
      drawCert();
      const btn = document.getElementById('saveCert'); if (btn) btn.hidden = false;
    }
  }

  /* ---------- 인증서 이미지 ---------- */
  const CERT_W = 1080, CERT_H = 1350;
  const CERT_ICONS = [
    ['sun',      '늦가을 날씨'],
    ['umbrella', '비 소식'],
    ['thermo',   '큰 일교차'],
    ['mitten',   '첫 영하 추위'],
  ];
  const certFonts = Promise.all([
    document.fonts ? document.fonts.load('80px "Jua"') : null,
    document.fonts ? document.fonts.load('30px "Gowun Dodum"') : null,
  ]).catch(() => {});
  const icoImgs = {};
  function icoImage(id) {
    if (!icoImgs[id]) icoImgs[id] = new Promise(res => {
      const sym = document.getElementById('b-' + id);
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400">${sym ? sym.innerHTML : ''}</svg>`;
      const img = new Image();
      img.onload = () => res(img); img.onerror = () => res(null);
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    });
    return icoImgs[id];
  }
  function rrect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  let certCanvas = null, drawSeq = 0;
  async function drawCert() {
    const seq = ++drawSeq;
    await certFonts;
    const imgs = await Promise.all(CERT_ICONS.map(m => icoImage(m[0])));
    if (seq !== drawSeq) return;
    const D = '"Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
    const B = '"Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
    const c = document.createElement('canvas'); c.width = CERT_W; c.height = CERT_H;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, CERT_W, CERT_H);
    g.addColorStop(0, '#E3F0FA'); g.addColorStop(0.55, '#DEF3E7'); g.addColorStop(1, '#FFF5CF');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CERT_W, CERT_H);
    rrect(ctx, 60, 60, CERT_W - 120, CERT_H - 120, 48); ctx.fillStyle = '#FFFFFF'; ctx.fill();
    ctx.setLineDash([18, 12]); ctx.lineWidth = 6; ctx.strokeStyle = '#8DBFE3'; ctx.stroke(); ctx.setLineDash([]);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    rrect(ctx, CERT_W / 2 - 210, 110, 420, 64, 32); ctx.fillStyle = '#E3F0FA'; ctx.fill();
    ctx.fillStyle = '#3A86C8'; ctx.font = `34px ${D}`; ctx.fillText('날씨 뉴스 읽기 완료!', CERT_W / 2, 155);
    ctx.fillStyle = '#23384A'; ctx.font = `88px ${D}`; ctx.fillText('꼬마 기상캐스터 인증서', CERT_W / 2, 290);
    const colW = (CERT_W - 160) / 4;
    CERT_ICONS.forEach((m, i) => {
      const cx = 80 + colW * i + colW / 2;
      rrect(ctx, cx - 100, 340, 200, 200, 36); ctx.fillStyle = '#EFF6FC'; ctx.fill();
      if (imgs[i]) ctx.drawImage(imgs[i], cx - 85, 352, 170, 170);
      ctx.fillStyle = '#23384A'; ctx.font = `28px ${D}`; ctx.fillText(m[1], cx, 592);
    });
    ctx.fillStyle = '#5F7486'; ctx.font = `34px ${D}`; ctx.fillText('기상캐스터 이름', CERT_W / 2, 720);
    const nm = (state.name || '').trim() || '기상캐스터';
    let size = 120; ctx.font = `${size}px ${D}`;
    while (ctx.measureText(nm).width > 760 && size > 50) { size -= 6; ctx.font = `${size}px ${D}`; }
    ctx.fillStyle = '#E8782E'; ctx.fillText(nm, CERT_W / 2, 850);
    ctx.fillStyle = '#F2B100'; rrect(ctx, CERT_W / 2 - 300, 875, 600, 10, 5); ctx.fill();
    rrect(ctx, CERT_W / 2 - 210, 925, 420, 84, 42); ctx.fillStyle = '#FFF5CF'; ctx.fill();
    ctx.fillStyle = '#23384A'; ctx.font = `44px ${D}`; ctx.fillText(`모은 별 ⭐ ${state.stars}개`, CERT_W / 2, 982);
    rrect(ctx, 130, 1050, CERT_W - 260, 110, 30); ctx.fillStyle = '#E3F0FA'; ctx.fill();
    ctx.fillStyle = '#1F5480'; ctx.font = `40px ${D}`; ctx.fillText('"일기예보 보고 미리 준비할게요!"', CERT_W / 2, 1120);
    const d = new Date();
    ctx.fillStyle = '#8A968F'; ctx.font = `28px ${B}`;
    ctx.fillText(`${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`, CERT_W / 2, 1212);
    ctx.fillStyle = '#9AA3AD'; ctx.font = `26px ${D}`; ctx.fillText('@sososoop_notes', CERT_W / 2, 1252);
    certCanvas = c;
    const img = document.getElementById('certImg');
    if (img) img.src = c.toDataURL('image/png');
  }
  async function saveCert(btn) {
    if (!certCanvas) return;
    const hint = document.getElementById('certHint');
    btn.disabled = true;
    try {
      const blob = await new Promise(r => certCanvas.toBlob(r, 'image/png'));
      const nm = (state.name || '').trim().replace(/[\\/:*?"<>|]/g, '') || '기상캐스터';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `꼬마기상캐스터_인증서_${nm}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      if (hint) hint.textContent = '인증서를 저장했어요! 🎉 저장이 안 되면 그림을 길게 눌러 저장해 주세요.';
    } catch(e) {
      if (hint) hint.textContent = '인증서 그림을 길게 눌러(컴퓨터는 오른쪽 클릭) 저장해 주세요.';
    } finally { btn.disabled = false; }
  }

  function render() {
    if (state.view === 'map') renderMap();
    else if (state.view === 'notebook') renderNotebook();
    else renderStage();
    window.scrollTo({top:0});
  }

  /* ---------- 입력 ---------- */
  $app.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;

    if (act === 'map') { state.view = 'map'; return render(); }
    if (act === 'notebook') { state.view = 'notebook'; return render(); }
    if (act === 'sound') { state.sound = !state.sound; save(); b.textContent = state.sound ? '🔊' : '🔈'; return; }
    if (act === 'savecert') return saveCert(b);
    if (act === 'reset') { const keep = state.sound; state = fresh(); state.sound = keep; save(); return render(); }
    if (act === 'stage') { state.view = 'stage'; state.stage = +b.dataset.i; state.q = 0; state.stageStars = 0; return render(); }
    if (act === 'next') { if (round && round.star) state.stageStars = (state.stageStars || 0) + 1; state.q++; return render(); }
    if (round && round.solved) return;

    if (act === 'voc') {
      const v = VOC[state.q];
      if (b.dataset.w === v.ans) right(`<b style="color:var(--mint)">${esc(v.ans)}</b> — ${esc(v.mean)}`, b);
      else wrong(`뜻을 한 번 더 읽어 봐요. 어떤 낱말이 어울릴까요?`, b);
    }
    if (act === 'fill') {
      const f = FILL[state.q];
      if (b.dataset.w === f.ans) {
        const bl = document.getElementById('blank'); if (bl) bl.textContent = f.ans;
        right(`${f.pre?esc(f.pre)+' ':''}<b style="color:var(--lemon)">${esc(f.ans)}</b> ${esc(f.post)}`, b);
      } else wrong(`문장에 넣어 읽어 보면 어색해요. 다른 낱말을 골라 봐요.`, b);
    }
    if (act === 'ext') {
      const x = EXT[state.q];
      if (b.dataset.w === x.ans) right(`<b style="color:var(--nut)">${esc(x.ans)}</b> — ${esc(x.why)}`, b);
      else wrong(`🔑 <b>${esc(x.root)} = ${esc(x.hint)}</b>, 그리고 <b>${esc(x.tip)}</b>. 글자 뜻을 합쳐 생각해 봐요.`, b);
    }
    if (act === 'orderpick') {
      const i = round.filled.findIndex(v => v == null);
      round.filled[i === -1 ? round.filled.length : i] = +b.dataset.p;
      drawOrder();
      if (round.filled.filter(v => v != null).length === 3) {
        if (round.filled.join() === '0,1,2') right(`<b>차례 맞았어요!</b><br>${round.parts.map((p,i)=>`${i+1}. ${esc(p)}`).join('<br>')}`, document.querySelector('.slots'));
        else wrong(`<b>처음 → 다음 → 마지막</b> 차례예요. 칸을 눌러 조각을 빼고 다시 넣어 봐요.`, document.querySelector('.slots'));
      }
    }
    if (act === 'unslot') {
      const i = +b.dataset.i;
      if (round.filled[i] == null) return;
      round.filled[i] = null;
      drawOrder();
    }
    if (act === 'fo') {
      const f = FO[state.q];
      if (b.dataset.v === f.a) right(`${f.a==='fact'?'사실':'의견'}이에요! ${esc(f.why)}`, b);
      else wrong(`확인할 수 있으면 '사실', 생각이나 느낌이면 '의견'이에요.`, b);
    }
    if (act === 'ox') {
      const o = OX[state.q];
      const v = b.dataset.v === '1';
      if (v === o.a) right(`${o.a ? 'O' : 'X'} 맞아요! ${esc(o.why)}`, b);
      else wrong(`날씨 뉴스에서 읽은 내용을 떠올려 봐요.`, b);
    }
  });

  render();
})();
</script>
</body></html>
