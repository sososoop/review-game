<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>복습게임 모음 | 소소숲</title><meta name="description" content="소소숲 읽기자료 복습게임 모음"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  :root{color-scheme:light;--ink:#2E3A22;--sub:#6B7A5A;--line:#D9E4CF;--paper:#fff;
    --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#EAF4E0 0%,#EEF6FC 100%) fixed;color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6;word-break:keep-all;min-height:100vh}
  .wrap{max-width:760px;margin:0 auto;padding:28px 16px 40px}
  h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,7vw,42px);line-height:1.2;margin:0}
  .kick{font-family:var(--display);color:#4A9D5F;font-size:17px}
  .lead{color:var(--sub);margin:6px 0 22px}
  .list{display:grid;gap:14px}
  a.game{display:flex;align-items:center;gap:16px;background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:14px 18px;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
  a.game:hover{transform:translateY(-2px);border-color:var(--c)}
  a.game:focus-visible{outline:3px solid var(--c);outline-offset:3px}
  .em{flex:none;width:64px;height:64px;border-radius:50%;background:var(--cs);border:3px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:30px}
  .t{font-family:var(--display);font-size:23px}
  .d{color:var(--sub);font-size:16px}
  .go{margin-left:auto;font-family:var(--display);color:var(--c);font-size:20px;white-space:nowrap}
  .credit{text-align:center;font-family:var(--display);font-size:15px;color:var(--sub);margin-top:28px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<main class="wrap">
  <div class="kick">🎮 소소숲 복습게임</div>
  <h1>읽기자료 복습게임 모음</h1>
  <p class="lead">학습지로 읽은 글을 게임으로 한 번 더 복습해요.</p>
  <nav class="list" aria-label="복습게임 목록">
    <a class="game" href="elnino/" style="--c:#3C8DBB;--cs:#E4F2FC">
      <span class="em" aria-hidden="true">❄️</span>
      <span><span class="t">겨울 안전 탐험대</span><br><span class="d">뉴스 읽기 · 역대급 엘니뇨와 대설·한파 대비</span></span>
      <span class="go">시작 ▶</span>
    </a>
    <a class="game" href="hojakdo/" style="--c:#E8782E;--cs:#FDEADB">
      <span class="em" aria-hidden="true">🐯</span>
      <span><span class="t">새해 그림 탐험대</span><br><span class="d">뉴스 읽기 · 인천공항 연말 장식과 호작도</span></span>
      <span class="go">시작 ▶</span>
    </a>
    <a class="game" href="1111/" style="--c:#A9743A;--cs:#F3E7D8">
      <span class="em" aria-hidden="true">🔎</span>
      <span><span class="t">기념일 탐험대</span><br><span class="d">뉴스 읽기 · 11월 11일 빼빼로데이와 가래떡데이</span></span>
      <span class="go">시작 ▶</span>
    </a>
    <a class="game" href="weather/" style="--c:#3A86C8;--cs:#E3F0FA">
      <span class="em" aria-hidden="true">🎙️</span>
      <span><span class="t">꼬마 기상캐스터</span><br><span class="d">날씨 뉴스 읽기 · 큰 일교차와 첫 영하 추위</span></span>
      <span class="go">시작 ▶</span>
    </a>
    <a class="game" href="dotori/" style="--c:#4A9D5F;--cs:#E6F3DC">
      <span class="em" aria-hidden="true">🐿️</span>
      <span><span class="t">도토리 지킴이</span><br><span class="d">실용문 읽기 · 공원 안내문</span></span>
      <span class="go">시작 ▶</span>
    </a>
  </nav>
  <div class="credit">@sososoop_notes</div>
</main>
</body></html>
